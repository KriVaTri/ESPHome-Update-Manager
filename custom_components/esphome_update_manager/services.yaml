start_updates:
  name: Start Updates
  description: Start updates for all ESPHome devices that have updates available.
  fields:
    entity_ids:
      name: Entity IDs
      description: Optional list of specific entity IDs to update. If not provided, all devices with available updates will be updated.
      required: false
      example: "['update.esp_test_firmware', 'update.esp_living_firmware']"
      selector:
        entity:
          multiple: true
          filter:
            domain: update
    stop_addon:
      name: Stop VS Code Server
      description: Whether to stop the VS Code Server add-on during updates. If not provided, uses the saved setting.
      required: false
      example: true
      selector:
        boolean:

force_install:
  name: ESPHome Yaml Force Install
  description: Force compile and OTA install device(s) (even without pending update)
  fields:
    device_id:
      name: Device(s)
      description: The ESPHome device(s) to force install
      required: true
      selector:
        device:
          multiple: true
          integration: esphome

refresh_project_versions:
  name: Refresh Project Versions
  description: >-
    Re-check the YAML configuration of all online devices for project version
    bumps. If auto-update is enabled with scope "project" or "both", any detected
    bumps will be queued for force install automatically. Equivalent to clicking
    the refresh button in the panel.

clean_build_files:
  name: Clean build files
  description: >-
    Clean build files for ESPHome devices (equivalent to "Clean Build Files" in the
    ESPHome dashboard). If no devices are selected, all ESPHome devices will be cleaned.
  fields:
    device_id:
      name: Devices
      description: One or more ESPHome devices. Leave empty to clean all devices.
      required: false
      selector:
        device:
          multiple: true
          integration: esphome

compile:
  name: Compile firmware
  description: >-
    Compile firmware for ESPHome devices WITHOUT uploading (equivalent to
    "Install → Manual download → Cancel" in the ESPHome dashboard). Useful to
    pre-compile firmware so a later OTA upload is fast — especially for
    sleeping devices with short wake windows. If no devices are selected, all
    ESPHome devices will be compiled.
  fields:
    device_id:
      name: Devices
      description: One or more ESPHome devices. Leave empty to compile all devices.
      required: false
      selector:
        device:
          multiple: true
          integration: esphome

get_device_status:
  name: Get Device Status
  description: >-
    Check whether one or more devices currently have a pending or running
    force install queued by the integration. Returns a response with
    pending/running/active flags per device — useful in automations that
    need to know whether to wait for an update before acting (e.g. deep
    sleep devices).
  fields:
    device_id:
      name: Device(s)
      description: One or more Home Assistant device IDs to check.
      required: true
      example: "['abc123def456']"
      selector:
        device:
          multiple: true
          integration: esphome

upload:
  name: OTA upload firmware
  description: >-
    OTA upload firmware to ESPHome devices. Assumes firmware is already
    compiled (run the "Compile firmware" service first for fastest results).
    If no devices are selected, firmware will be uploaded to all ESPHome devices.
  fields:
    device_id:
      name: Devices
      description: One or more ESPHome devices. Leave empty to upload to all devices.
      required: false
      selector:
        device:
          multiple: true
          integration: esphome
